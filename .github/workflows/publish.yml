name: Publish to npm

# The registry is the source of truth for versions: this workflow reads the
# published version, bumps it in the working copy only, publishes, and records
# the release as a tag. Nothing is ever committed to main, so the branch can
# stay protected. The version in package.json is a placeholder.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version bump'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: 'Validate and pack only, publish nothing'
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate skills and run tests
        run: npm run check

      - name: Resolve the next version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          # Only "the package does not exist yet" may fall back to 0.0.0. Any
          # other registry failure must stop the run: treating it as "nothing
          # published" would recompute the version from scratch and could
          # release backwards over the current one.
          err=$(mktemp)
          if ! current=$(npm view "$name" version 2>"$err"); then
            if grep -q 'E404' "$err"; then
              current=0.0.0
            else
              cat "$err" >&2
              exit 1
            fi
          fi
          echo "Published: $current"
          npm pkg set version="$current"
          next=$(npm version "$RELEASE" --no-git-tag-version --allow-same-version)
          echo "Releasing: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # Fail here rather than after publishing: `gh release create` reuses an
      # existing tag and silently ignores --target, so a leftover tag would
      # attach the release to the wrong commit. Runs on dry runs too.
      - name: Verify the tag is free
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; refusing to release over it" >&2
            exit 1
          fi

      - name: Pack (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Creates the tag on the released commit as well as the release entry, so
      # the repository page shows the version without a commit landing on main.
      - name: Create the GitHub release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
