name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version bump'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: 'Validate and pack only, publish nothing'
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate skills and run tests
        run: npm run check

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (${{ inputs.release }})
        id: bump
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(npm version "$RELEASE" -m "chore(release): v%s")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Fail here rather than after publishing: an npm release whose tag never
      # landed in git cannot be undone.
      - name: Verify the release can be pushed
        run: git push --dry-run --follow-tags origin HEAD:main

      - name: Pack (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit and tag
        if: ${{ !inputs.dry-run }}
        run: git push --follow-tags origin HEAD:main

      - name: Create GitHub release
        if: ${{ !inputs.dry-run }}
        run: gh release create "${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
